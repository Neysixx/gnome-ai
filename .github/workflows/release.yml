name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version number
        id: extract-version
        if: ${{ steps.release.outputs.release_created }}
        run: |
          VERSION="${{ steps.release.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

  build-and-push-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "🔧 Setup Bun Runtime"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "📦 Install Dependencies"
        run: bun install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Next.js
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            neysixx/gnome-ai-assistant-nextjs:latest
            neysixx/gnome-ai-assistant-nextjs:${{ needs.release-please.outputs.tag_name }}

      - name: Build GNOME extension
        run: |
          cd gnome
          bun run build

      # Upload release assets
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            docker-compose.yml \
            gnome/gnome-ai-assistant@neysixx.shell-extension.zip \
            --clobber

  update-docker-compose:
    needs: [release-please, build-and-push-docker]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update docker-compose.yml version
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          echo "Updating docker-compose.yml to tag: $TAG"

          sed -i "s|neysixx/gnome-ai-assistant-nextjs:[^[:space:]]*|neysixx/gnome-ai-assistant-nextjs:${TAG}|g" docker-compose.yml

          echo "Changes made:"
          git diff docker-compose.yml

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docker-compose.yml; then
            echo "No changes to commit"
            exit 0
          fi

          git add docker-compose.yml
          git commit -m "chore: update nextjs image to ${{ needs.release-please.outputs.tag_name }} [skip ci]"
          git push
