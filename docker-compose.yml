services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: gnome-ai-assistant-nextjs
    restart: always
    ports:
      - "9999:9999"
    volumes:
      # Mount config files (read-write for user overrides)
      - ./config.default.json:/app/config.default.json:ro
      - ./config.json:/app/config.json:rw
    environment:
      # Secrets from .env file at monorepo root
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}

      # Application Configuration
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=9999
