services:
  app:
    image: neysixx/gnome-ai-assistant-nextjs:v1.0.3 # x-release-please-version
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      # Mount config files (read-write for user overrides)
      - ./config.default.json:/app/config.default.json:ro
      - ./config.json:/app/config.json:rw
    environment:
      # Secrets from .env file at monorepo root
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}

      # Application Configuration
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=9999
  speech-server-fr:
    image: alphacep/kaldi-fr:latest
    container_name: speech-server-fr
    ports:
      - "2700:2700"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2700"]
      interval: 10s
      timeout: 5s
      retries: 3
  speech-server-en:
    image: alphacep/kaldi-en:latest
    container_name: speech-server-en
    ports:
      - "2701:2701"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2701"]
      interval: 10s
      timeout: 5s
      retries: 3
