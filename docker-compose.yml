version: "3.8"

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: gnome-ai-assistant-nextjs
    restart: always
    ports:
      - "9999:9999"
    networks:
      - ai-gnome-assistant-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount config files (read-write for user overrides)
      - ./config.default.json:/app/config.default.json:ro
      - ./config.json:/app/config.json:rw
    environment:
      # Secrets from .env file at monorepo root
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}

      # Application Configuration
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=9999

  postgres:
    image: postgres:16-alpine
    container_name: gnome-ai-assistant-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-gnome-assistant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  ai-gnome-assistant-network:
    name: ai-gnome-assistant-network
    driver: bridge
